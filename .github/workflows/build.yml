name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name TikTokTTS `
            --collect-all customtkinter `
            --collect-all piper `
            --collect-all pygame `
            --collect-all TikTokLive `
            main.py

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikTokTTS-windows-exe
          path: dist/TikTokTTS.exe

      - name: Publish EXE as a GitHub Release (simple direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TikTokTTS (latest build)
          body: "Автоматично построен .exe. Изтегли TikTokTTS.exe по-долу."
          files: dist/TikTokTTS.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
