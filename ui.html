<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok TTS</title>
<style>
  :root{
    --bg:#0E0E13; --surface:#16161F; --surface-2:#1D1D28; --line:#2A2A38;
    --text:#EDEDF2; --muted:#8B8B9E;
    --accent:#7C5CFF; --accent-2:#9B7DFF; --accent-dim:#7C5CFF22;
    --ok:#3DDC84; --warn:#FFB020; --err:#FF5C5C;
    --r:14px; --r-sm:9px;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{
    font:14px/1.55 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
    background:var(--bg); color:var(--text); height:100vh; overflow:hidden;
    -webkit-font-smoothing:antialiased; user-select:none;
  }
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#33334a;border-radius:6px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#42425c}

  .app{display:flex;flex-direction:column;height:100vh}

  /* ---------- Top bar ---------- */
  header{
    display:flex;align-items:center;gap:22px;padding:14px 22px;
    background:linear-gradient(180deg,#191922,#14141C);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:11px;min-width:150px}
  .logo{
    width:36px;height:36px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,var(--accent),#4DD0E1);
    display:grid;place-items:center;font-size:17px;
    box-shadow:0 4px 14px #7C5CFF44;
  }
  .brand h1{font-size:15px;font-weight:650;letter-spacing:-.2px}
  .brand span{font-size:11px;color:var(--muted)}

  .pills{display:flex;gap:8px;flex-wrap:wrap;flex:1}
  .pill{
    display:inline-flex;align-items:center;gap:7px;padding:6px 12px;
    background:var(--surface-2);border:1px solid var(--line);
    border-radius:100px;font-size:12px;font-weight:500;white-space:nowrap;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
  .dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .dot.warn{background:var(--warn);box-shadow:0 0 8px var(--warn)}
  .dot.err{background:var(--err);box-shadow:0 0 8px var(--err)}
  .stat{color:var(--muted)} .stat b{color:var(--text);font-weight:650}

  .actions{display:flex;gap:9px}

  /* ---------- Buttons ---------- */
  button{
    font:inherit;font-weight:600;cursor:pointer;border:1px solid transparent;
    border-radius:var(--r-sm);padding:9px 16px;color:var(--text);
    background:var(--surface-2);border-color:var(--line);
    transition:background .13s, border-color .13s, transform .08s, box-shadow .13s;
  }
  button:hover{background:#262634;border-color:#3A3A50}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.4;cursor:default;transform:none}
  .primary{background:var(--accent);border-color:var(--accent);color:#fff;
    box-shadow:0 3px 12px #7C5CFF3D}
  .primary:hover:not(:disabled){background:var(--accent-2);border-color:var(--accent-2)}
  .danger{background:var(--err);border-color:var(--err);color:#fff}
  .danger:hover:not(:disabled){background:#ff7070;border-color:#ff7070}
  .ghost{background:transparent}

  /* ---------- Segmented ---------- */
  .seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r-sm);padding:3px;gap:3px}
  .seg button{
    background:transparent;border:none;padding:7px 15px;font-size:12.5px;
    font-weight:600;color:var(--muted);border-radius:6px;box-shadow:none;
  }
  .seg button:hover{background:#22222f;color:var(--text)}
  .seg button.on{background:var(--accent);color:#fff;box-shadow:0 2px 8px #7C5CFF44}

  .subbar{display:flex;align-items:center;gap:16px;padding:11px 22px;
    background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .subbar > label{font-size:12px;color:var(--muted);font-weight:600;
    text-transform:uppercase;letter-spacing:.5px}

  /* ---------- Layout ---------- */
  .body{display:flex;flex:1;min-height:0}
  nav{width:186px;flex:none;padding:14px 10px;background:var(--surface);
    border-right:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
  nav button{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    background:transparent;border:none;padding:10px 13px;border-radius:var(--r-sm);
    color:var(--muted);font-weight:550;font-size:13.5px;
  }
  nav button:hover{background:var(--surface-2);color:var(--text)}
  nav button.on{background:var(--accent-dim);color:var(--accent-2)}
  nav button.on::before{content:"";position:absolute;margin-left:-13px;
    width:3px;height:18px;background:var(--accent);border-radius:2px}
  nav .ico{width:19px;text-align:center;font-size:15px}

  main{flex:1;overflow-y:auto;padding:24px 28px}
  .page{display:none;animation:in .18s ease} .page.on{display:block}
  @keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

  /* ---------- Cards ---------- */
  .card{background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r);padding:20px 22px;margin-bottom:16px}
  .card h2{font-size:14.5px;font-weight:650;margin-bottom:3px;
    display:flex;align-items:center;gap:9px}
  .card h2::before{content:"";width:3px;height:15px;background:var(--accent);
    border-radius:2px;flex:none}
  .card .sub{font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.5}

  .row{display:flex;align-items:center;gap:14px;margin-bottom:13px}
  .row:last-child{margin-bottom:0}
  .row > label{width:180px;flex:none;font-size:13px;color:var(--muted);font-weight:500}
  .row .grow{flex:1;min-width:0}

  input[type=text],input[type=password],input[type=number],select,textarea{
    font:inherit;width:100%;padding:9px 12px;border-radius:var(--r-sm);
    background:var(--bg);border:1px solid var(--line);color:var(--text);
    transition:border-color .13s, box-shadow .13s;user-select:text;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-dim)}
  input.sm{width:88px}
  textarea{resize:vertical;min-height:76px;font-size:13px;line-height:1.6}
  select{cursor:pointer;appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='11' height='7'><path d='M1 1l4.5 4.5L10 1' stroke='%238B8B9E' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");
    background-repeat:no-repeat;background-position:right 12px center;padding-right:32px}

  .check{display:flex;align-items:center;gap:10px;padding:7px 0;cursor:pointer;font-size:13.5px}
  .check input{appearance:none;width:19px;height:19px;flex:none;border-radius:6px;
    border:1.5px solid #3A3A50;background:var(--bg);cursor:pointer;
    transition:background .13s,border-color .13s;position:relative}
  .check input:checked{background:var(--accent);border-color:var(--accent)}
  .check input:checked::after{content:"✓";position:absolute;inset:0;color:#fff;
    font-size:12px;font-weight:800;display:grid;place-items:center}

  input[type=range]{-webkit-appearance:none;background:transparent;height:20px;
    padding:0;border:none;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;
    background:linear-gradient(90deg,var(--accent) var(--p,50%),#2E2E40 var(--p,50%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;
    border-radius:50%;background:#fff;margin-top:-6px;box-shadow:0 2px 7px #0009}
  .val{width:58px;text-align:right;font-variant-numeric:tabular-nums;
    font-size:12.5px;color:var(--muted);font-weight:600;flex:none}

  .hint{font-size:12px;color:var(--muted);line-height:1.6;margin-top:9px;
    padding-left:11px;border-left:2px solid var(--line)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid button{padding:11px 14px;text-align:left;font-size:13px;font-weight:550}

  /* ---------- Log ---------- */
  .logwrap{background:#0A0A0E;border:1px solid var(--line);border-radius:var(--r);
    padding:14px 16px;height:330px;overflow-y:auto;
    font:12.5px/1.65 "Cascadia Mono",Consolas,monospace;user-select:text}
  .logwrap div{white-space:pre-wrap;word-break:break-word;padding:1px 0}
  .l-err{color:var(--err)} .l-ok{color:var(--ok)} .l-warn{color:var(--warn)}
  .l-ai{color:var(--accent-2)} .l-dbg{color:#5C5C72} .l-sys{color:var(--muted)}
  .toolbar{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">
      <div class="logo">🎙</div>
      <div><h1>TikTok TTS</h1><span>глас и AI за твоя лайв</span></div>
    </div>
    <div class="pills">
      <span class="pill"><i class="dot" id="d1"></i><span id="st1">Зареждане…</span></span>
      <span class="pill"><i class="dot" id="d2"></i><span id="st2">Live AI</span></span>
      <span class="pill stat">👥 <b id="s-view">0</b></span>
      <span class="pill stat">➕ <b id="s-fol">0</b></span>
      <span class="pill stat">🔁 <b id="s-sh">0</b></span>
      <span class="pill stat">🎁 <b id="s-gift">0</b></span>
      <span class="pill stat">💬 <b id="s-com">0</b></span>
    </div>
    <div class="actions">
      <button id="btn-mute" class="ghost" onclick="api.toggle_mute()">🔊 Заглуши</button>
      <button id="btn-stop" class="ghost" onclick="api.stop_listening()" disabled>■ Стоп</button>
      <button id="btn-start" class="primary" onclick="api.start_listening()">▶ Старт</button>
    </div>
  </header>

  <div class="subbar">
    <label>Режим</label>
    <div class="seg" id="seg-profile"></div>
    <label style="margin-left:12px">Кой говори</label>
    <div class="seg" id="seg-output"></div>
  </div>

  <div class="body">
    <nav id="nav"></nav>
    <main id="main"></main>
  </div>
</div>

<script src="ui.js"></script>
</body>
</html>
